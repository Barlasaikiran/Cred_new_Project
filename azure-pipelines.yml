pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: 'acr-connection-credpay'
  frontendrepository: 'credpay/frontend'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag:  $(Build.BuildId)

stages:
  - stage: terraform
    displayName: terraform infra
    jobs:
      - job: terraformApply
        displayName: terraform init & apply

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: AzureCLI@3
            inputs:
              connectionType: 'azureRM'
              azureSubscription: 'HDFC-Manual-New'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: terraform
              inlineScript: |
                terraform init
                terraform plan






