

pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: 'acr-connection'
  frontendrepository: 'credpay/frontend'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'

tag: '${Build.BuildId}'

stages:
  - stage: dockerBuild
    displayName: dockerBuild
    jobs: 
      - job: buildpushImages
        steps:
          - checkout: self
          - task: Docker@2
            inputs:
              containerRegistry: 'acr-connection'
              repository: '$(frontendrepository)'
              command: 'buildAndPush'
              Dockerfile: 'frontend-react\dockerfile'
              buildContext: 'frontend-react'
              tags: |
                $(tag)
                latest
          - task: Docker@2
            inputs:
              containerRegistry: 'acr-connection'
              repository: '$(userrepository)'
              command: 'buildAndPush'
              Dockerfile: 'user-service\dockerfile'
              buildContext: 'user-service'
              tags: |
                $(tag)
                latest
          - task: Docker@2
            inputs:
              containerRegistry: 'acr-connection'
              repository: '$(paymentrepository)'
              command: 'buildAndPush'
              Dockerfile: 'payment-service\dockerfile'
              buildContext: 'payment-service'
              tags: |
                $(tag)
                latest
          

